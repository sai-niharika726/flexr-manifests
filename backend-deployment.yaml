apiVersion: apps/v1
kind: Deployment
metadata:
  name: backeend-deployment
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: bsainiharika/flexr-app:backend-v6
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 60Mi
            limits:
              cpu: 200m
              memory: 128Mi
