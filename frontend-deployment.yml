apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: bsainiharika/flexr-app:frontend-v6
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 60Mi
            limits:
              cpu: 200m
              memory: 128Mi
